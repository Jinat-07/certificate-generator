<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Certificate Generator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Playfair Display matches the elegant serif font of your certificate perfectly -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Certificate Generator</h1>

        <!-- Controls -->
        <div class="controls">
            <div class="input-group">
                <label for="nameInput">Participant Name</label>
                <input type="text" id="nameInput" placeholder="Enter participant name">
            </div>
            
            <div class="input-group">
                <label for="dateInput">Issue Date</label>
                <input type="text" id="dateInput" placeholder="e.g., 5th September 2026">
            </div>

            <button id="downloadBtn">Download Certificate</button>
        </div>

        <!-- Certificate Preview -->
        <div class="preview-container">
            <div class="certificate" id="certificateBox">
                <!-- Image source updated to template.png -->
                <img src="template.png" alt="Certificate Background" class="cert-bg">
                
                <div class="cert-text name-text" id="displayName">Participant Name</div>
                <div class="cert-text date-text" id="displayDate">5th September 2026</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
